<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SwasthyaSetu Mobile App - Phase 4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #fafbfc;
            line-height: 1.6;
            overflow: hidden;
        }
        
        :root {
            --primary: #0F4C75;
            --primary-dark: #0a2f52;
            --success: #3ECF8E;
            --warning: #F7B32B;
            --danger: #E63946;
            --neutral-50: #f9fafb;
            --neutral-100: #f3f4f6;
            --neutral-200: #e5e7eb;
            --neutral-600: #4b5563;
            --neutral-800: #1f2937;
            --neutral-900: #111827;
        }
        
        .mobile-frame {
            width: 375px;
            height: 812px;
            margin: 0 auto;
            background: white;
            border-radius: 40px;
            border: 8px solid #000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .status-bar {
            height: 44px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: var(--primary);
            color: white;
            padding: 16px;
            padding-top: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .language-menu {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .user-role {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .role-selector {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 6px;
        }
        
        .role-btn {
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .role-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .notification-badge {
            position: absolute;
            top: 60px;
            left: 16px;
            right: 16px;
            background: var(--warning);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 10;
            animation: slideInDown 0.3s ease;
        }
        
        @keyframes slideInDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .notification-badge.danger { background: var(--danger); }
        .notification-badge.dismiss {
            font-size: 14px;
            cursor: pointer;
            margin-left: auto;
        }
        
        .card {
            background: white;
            border: 1px solid var(--neutral-200);
            border-radius: 12px;
            padding: 12px;
            animation: slideInUp 0.3s ease;
        }
        
        .card-header {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .badge-warning { background: rgba(247, 179, 43, 0.2); color: #92400e; }
        .badge-danger { background: rgba(230, 57, 70, 0.2); color: #991b1b; }
        .badge-success { background: rgba(62, 207, 142, 0.2); color: #065f46; }
        .badge-info { background: rgba(15, 76, 117, 0.2); color: #0c2d48; }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .stat-label { color: var(--neutral-600); }
        .stat-value { font-weight: 600; color: var(--neutral-900); }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--neutral-200);
            border-radius: 3px;
            margin: 8px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #1a6fa0);
            transition: width 0.6s ease;
        }
        
        .workflow-step {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px;
            background: var(--neutral-50);
            border-radius: 6px;
            border-left: 3px solid var(--neutral-200);
            font-size: 12px;
        }
        
        .workflow-step.active { border-left-color: var(--warning); background: rgba(247, 179, 43, 0.05); }
        .workflow-step.completed { border-left-color: var(--success); background: rgba(62, 207, 142, 0.05); }
        
        .workflow-icon {
            min-width: 20px;
            text-align: center;
        }
        
        .workflow-content {
            flex: 1;
        }
        
        .workflow-title {
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .workflow-time {
            font-size: 11px;
            color: var(--neutral-600);
        }
        
        .btn {
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { background: var(--primary-dark); }
        .btn-secondary { background: var(--neutral-100); color: var(--primary); border: 1px solid var(--neutral-200); }
        .btn-secondary:active { background: var(--neutral-200); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: white;
            border-top: 1px solid var(--neutral-200);
            height: 60px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            margin-top: auto;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--neutral-600);
            transition: all 0.2s;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-badge {
            position: absolute;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            top: -8px;
            right: -8px;
        }
        
        .export-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            z-index: 100;
            animation: slideInUp 0.3s ease;
        }
        
        .export-sheet {
            background: white;
            border-radius: 16px 16px 0 0;
            padding: 16px;
            width: 100%;
            max-height: 50%;
            overflow-y: auto;
        }
        
        .export-option {
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--neutral-200);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .export-option:active { background: var(--neutral-100); }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        
        .modal {
            background: white;
            border-radius: 12px;
            padding: 16px;
            width: 90%;
            max-height: 70%;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .mobile-frame {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none;
            }
        }
    </style>
