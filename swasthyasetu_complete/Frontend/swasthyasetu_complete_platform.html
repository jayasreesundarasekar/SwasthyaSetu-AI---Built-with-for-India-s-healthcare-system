<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SwasthyaSetu AI - Complete Healthcare Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; }
        
        :root {
            --primary: #0F4C75;
            --primary-light: #1a6fa0;
            --success: #3ECF8E;
            --warning: #F7B32B;
            --danger: #E63946;
            --bg-dark: #0a0e27;
            --bg-card: rgba(26, 31, 58, 0.8);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f3a 100%);
            color: #fff;
            overflow: hidden;
        }
        
        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .app-header {
            background: rgba(15, 76, 117, 0.2);
            border-bottom: 1px solid rgba(15, 76, 117, 0.3);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        
        .app-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #1a6fa0, #3ECF8E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-menu {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .nav-btn {
            padding: 8px 14px;
            border: 1px solid rgba(15, 76, 117, 0.3);
            background: rgba(15, 76, 117, 0.1);
            color: var(--primary-light);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .nav-btn:hover, .nav-btn.active {
            background: var(--primary-light);
            color: white;
            border-color: var(--primary-light);
        }
        
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .phase-container {
            display: none;
        }
        
        .phase-container.active {
            display: block;
        }
        
        .section {
            background: var(--bg-card);
            border: 1px solid rgba(15, 76, 117, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(15, 76, 117, 0.1);
            border: 1px solid rgba(15, 76, 117, 0.2);
            border-radius: 8px;
            padding: 15px;
        }
        
        .card-title {
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        .card-value {
            font-size: 24px;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .card-label {
            font-size: 11px;
            color: #9ca3af;
        }
        
        .phc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
            margin: 15px 0;
        }
        
        .phc-node {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }
        
        .phc-node:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px currentColor;
        }
        
        .status-green { background: #3ECF8E; color: white; }
        .status-yellow { background: #F7B32B; color: #1a202c; }
        .status-orange { background: #fd7e14; color: white; }
        .status-red { background: #E63946; color: white; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
            50% { box-shadow: 0 0 0 6px rgba(230, 57, 70, 0); }
        }
        
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 4px;
        }
        
        .btn-primary {
            background: var(--primary-light);
            color: white;
        }
        
        .btn-primary:hover {
            background: #1a5a8f;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-warning {
            background: var(--warning);
            color: #1a202c;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .alert {
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid;
            font-size: 12px;
        }
        
        .alert-danger {
            background: rgba(230, 57, 70, 0.1);
            border-color: var(--danger);
            color: #fca5a5;
        }
        
        .alert-warning {
            background: rgba(247, 179, 43, 0.1);
            border-color: var(--warning);
            color: #fcd34d;
        }
        
        .alert-success {
            background: rgba(62, 207, 142, 0.1);
            border-color: var(--success);
            color: #86efac;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin: 10px 0;
        }
        
        .table th {
            background: rgba(15, 76, 117, 0.2);
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: var(--primary-light);
        }
        
        .table td {
            padding: 10px;
            border-bottom: 1px solid rgba(15, 76, 117, 0.2);
            color: #d1d5db;
        }
        
        .feature-list {
            list-style: none;
            margin: 10px 0;
        }
        
        .feature-list li {
            padding: 8px;
            margin: 4px 0;
            background: rgba(15, 76, 117, 0.1);
            border-radius: 4px;
            font-size: 12px;
            border-left: 3px solid var(--primary-light);
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(15, 76, 117, 0.2);
            font-size: 12px;
        }
        
        .metric-label {
            color: #9ca3af;
        }
        
        .metric-value {
            font-weight: 600;
            color: var(--primary-light);
        }
        
        .toggle-group {
            display: flex;
            gap: 6px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        
        .toggle-btn {
            padding: 6px 12px;
            border: 1px solid rgba(15, 76, 117, 0.3);
            background: transparent;
            color: var(--primary-light);
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }
        
        .toggle-btn.active {
            background: var(--primary-light);
            color: white;
        }
        
        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        
        .scenario-card {
            background: rgba(15, 76, 117, 0.1);
            border: 2px solid rgba(15, 76, 117, 0.2);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .scenario-card:hover {
            border-color: var(--primary-light);
            background: rgba(15, 76, 117, 0.15);
        }
        
        .scenario-title {
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 5px;
        }
        
        .scenario-desc {
            font-size: 11px;
            color: #9ca3af;
        }
        
        .recommendation-box {
            background: rgba(26, 111, 160, 0.1);
            border-left: 3px solid var(--primary-light);
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
        }
        
        .impact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        
        .impact-card {
            background: rgba(62, 207, 142, 0.05);
            border: 1px solid rgba(62, 207, 142, 0.2);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 11px;
        }
        
        .impact-metric {
            color: #9ca3af;
            margin-bottom: 5px;
        }
        
        .impact-before {
            color: #E63946;
            font-weight: 600;
            font-size: 13px;
        }
        
        .impact-arrow {
            color: #9ca3af;
            margin: 2px 0;
            font-size: 10px;
        }
        
        .impact-after {
            color: #3ECF8E;
            font-weight: 600;
            font-size: 13px;
        }
        
        @media (max-width: 1024px) {
            .grid-2 { grid-template-columns: 1fr; }
            .scenario-grid { grid-template-columns: 1fr; }
            .phc-grid { grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); }
        }
        
        .version-badge {
            display: inline-block;
            background: rgba(15, 76, 117, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--primary-light);
            margin-left: 10px;
        }
        
        .feature-badge {
            display: inline-block;
            background: rgba(62, 207, 142, 0.1);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            margin: 2px;
            border: 1px solid rgba(62, 207, 142, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useMemo } = React;
        
        function SwasthyaSetu() {
            const [activePhase, setActivePhase] = useState('mission-control');
            const [activeScenario, setActiveScenario] = useState(null);
            const [actionStatus, setActionStatus] = useState('');
            const [timeHorizon, setTimeHorizon] = useState('NOW');
            const [mockNetworkState, setMockNetworkState] = useState({
                critical: 2,
                warning: 8,
                stable: 70
            });
            
            // Stable per-node random rolls so the grid doesn't reshuffle on every re-render
            const nodeRolls = useMemo(() => Array.from({ length: 80 }, () => Math.random()), []);
            
            const phases = [
                { id: 'mission-control', label: '🚨 Mission Control' },
                { id: 'citizen', label: '👥 Citizen App' },
                { id: 'authority', label: '📊 Authority Dashboard' },
                { id: 'emergency', label: '🆘 Emergency Response' },
                { id: 'mobile', label: '📱 Mobile App' },
                { id: 'intelligence', label: '🧠 Intelligence Layer' }
            ];
            
            const triggerScenario = (scenario) => {
                setActiveScenario(scenario);
                setActionStatus('');
                const impacts = {
                    'surge': { critical: 8, warning: 24, stable: 48 },
                    'supply': { critical: 14, warning: 31, stable: 35 },
                    'shortage': { critical: 6, warning: 19, stable: 55 },
                    'emergency': { critical: 12, warning: 28, stable: 40 }
                };
                setMockNetworkState(impacts[scenario] || impacts['surge']);
            };
            
            // Projected state for the selected time horizon (NOW = as-is, later = worse if unmitigated)
            const horizonFactor = { 'NOW': 1, '+24H': 1.15, '+48H': 1.3, '+72H': 1.5 }[timeHorizon];
            const displayState = {
                critical: Math.round(mockNetworkState.critical * horizonFactor),
                warning: Math.round(mockNetworkState.warning * horizonFactor),
                stable: Math.max(0, 80 - Math.round(mockNetworkState.critical * horizonFactor) - Math.round(mockNetworkState.warning * horizonFactor))
            };
            
            return (
                <div className="app-container">
                    {/* Header */}
                    <div className="app-header">
                        <div className="app-title">
                            🇮🇳 SwasthyaSetu AI<span className="version-badge">v5.0 Complete</span>
                        </div>
                        <div className="nav-menu">
                            {phases.map(phase => (
                                <button 
                                    key={phase.id}
                                    className={`nav-btn ${activePhase === phase.id ? 'active' : ''}`}
                                    onClick={() => setActivePhase(phase.id)}
                                >
                                    {phase.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {/* Content */}
                    <div className="app-content">
                        {/* MISSION CONTROL */}
                        <div className={`phase-container ${activePhase === 'mission-control' ? 'active' : ''}`}>
                            <div className="section">
                                <div className="section-title">🚨 Mission Control - Live Health Network</div>
                                
                                <div className="grid-2">
                                    <div>
                                        <h4 style={{fontSize: '13px', marginBottom: '10px'}}>Live Network State</h4>
                                        <div className="phc-grid">
                                            {nodeRolls.map((rand, idx) => {
                                                let statusClass = 'status-green';
                                                if (activeScenario) {
                                                    if (rand < displayState.critical / 80) statusClass = 'status-red';
                                                    else if (rand < (displayState.critical + displayState.warning) / 80) statusClass = 'status-orange';
                                                } else if (rand > 0.97) statusClass = 'status-yellow';
                                                return <div key={idx} className={`phc-node ${statusClass}`}>•</div>;
                                            })}
                                        </div>
                                        <div style={{display: 'flex', gap: '15px', marginTop: '15px', flexWrap: 'wrap'}}>
                                            <div className="card">
                                                <div className="card-label">Critical</div>
                                                <div className="card-value" style={{color: '#E63946'}}>{displayState.critical}</div>
                                            </div>
                                            <div className="card">
                                                <div className="card-label">Warning</div>
                                                <div className="card-value" style={{color: '#F7B32B'}}>{displayState.warning}</div>
                                            </div>
                                            <div className="card">
                                                <div className="card-label">Stable</div>
                                                <div className="card-value" style={{color: '#3ECF8E'}}>{displayState.stable}</div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <h4 style={{fontSize: '13px', marginBottom: '10px'}}>Time Horizons</h4>
                                        <div className="toggle-group">
                                            {['NOW', '+24H', '+48H', '+72H'].map(time => (
                                                <button key={time} className={`toggle-btn ${timeHorizon === time ? 'active' : ''}`} onClick={() => setTimeHorizon(time)}>
                                                    {time}
                                                </button>
                                            ))}
                                        </div>
                                        
                                        <h4 style={{fontSize: '13px', marginTop: '15px', marginBottom: '10px'}}>Test Scenarios</h4>
                                        <div className="scenario-grid">
                                            {[
                                                {id: 'surge', title: '📈 Demand Surge', desc: '50% patient footfall increase'},
                                                {id: 'supply', title: '⚠️ Supply Disruption', desc: 'Logistics route failure'},
                                                {id: 'shortage', title: '💊 Medicine Shortage', desc: 'Critical inventory loss'},
                                                {id: 'emergency', title: '🚨 Regional Emergency', desc: 'Compound system failure'}
                                            ].map(scenario => (
                                                <div key={scenario.id} className={`scenario-card ${activeScenario === scenario.id ? 'active' : ''}`} onClick={() => triggerScenario(scenario.id)}>
                                                    <div className="scenario-title">{scenario.title}</div>
                                                    <div className="scenario-desc">{scenario.desc}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            {activeScenario && (
                                <div className="section">
                                    <div className="section-title">🤖 AI Recommendation</div>
                                    <div className="recommendation-box">
                                        <h4 style={{color: 'var(--primary-light)', marginBottom: '8px'}}>Scenario: {activeScenario.toUpperCase()}</h4>
                                        <p style={{fontSize: '12px', marginBottom: '12px', color: '#d1d5db'}}>
                                            {activeScenario === 'surge' && 'Transfer 2,400 units from surplus districts. Extend supply by 12+ days. Reduce stock-out risk from 78% to 12%.'}
                                            {activeScenario === 'supply' && 'Activate alternate supply routes. Reroute via backup corridor. Reduce delivery delay from 48 hours to 4-6 hours.'}
                                            {activeScenario === 'shortage' && 'Pre-position medicine from 9 surplus districts. Prevent cascade shortage across 15 PHCs.'}
                                            {activeScenario === 'emergency' && 'Mobilize full network surge response. Activate 180 emergency beds. Reduce response time from 48 hours to 12 minutes.'}
                                        </p>
                                        
                                        <div style={{marginBottom: '12px'}}>
                                            <strong style={{color: 'var(--success)', fontSize: '12px'}}>✓ Decision Trace:</strong>
                                            <ul style={{fontSize: '11px', color: '#9ca3af', marginLeft: '20px', marginTop: '6px'}}>
                                                <li>✓ Analyzed demand forecast</li>
                                                <li>✓ Identified surplus inventory</li>
                                                <li>✓ Calculated optimal routes</li>
                                                <li>✓ Verified safety stock</li>
                                                <li>✓ Simulated network impact</li>
                                            </ul>
                                        </div>
                                        
                                        <div className="impact-grid">
                                            <div className="impact-card">
                                                <div className="impact-metric">Stock-out Risk</div>
                                                <div className="impact-before">78%</div>
                                                <div className="impact-arrow">↓</div>
                                                <div className="impact-after">12%</div>
                                            </div>
                                            <div className="impact-card">
                                                <div className="impact-metric">Facilities at Risk</div>
                                                <div className="impact-before">14</div>
                                                <div className="impact-arrow">↓</div>
                                                <div className="impact-after">3</div>
                                            </div>
                                            <div className="impact-card">
                                                <div className="impact-metric">Coverage Window</div>
                                                <div className="impact-before">6 days</div>
                                                <div className="impact-arrow">↑</div>
                                                <div className="impact-after">18 days</div>
                                            </div>
                                            <div className="impact-card">
                                                <div className="impact-metric">Confidence Score</div>
                                                <div className="impact-after">92%</div>
                                            </div>
                                        </div>
                                        
                                        <div style={{marginTop: '12px', display: 'flex', gap: '8px', flexWrap: 'wrap'}}>
                                            <button className="btn btn-primary" onClick={() => setActionStatus('⚡ Simulation complete: projected outcome matches the impact cards above.')}>⚡ SIMULATE</button>
                                            <button className="btn btn-warning" onClick={() => setActionStatus('👁️ Decision trace opened for human review.')}>👁️ REVIEW</button>
                                            <button className="btn btn-success" onClick={() => setActionStatus('✓ Action approved and dispatched to district coordinators.')}>✓ APPROVE</button>
                                        </div>
                                        {actionStatus && <div className="alert alert-success" style={{marginTop: '12px'}}>{actionStatus}</div>}
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        {/* CITIZEN APP */}
                        <div className={`phase-container ${activePhase === 'citizen' ? 'active' : ''}`}>
                            <div className="section">
                                <div className="section-title">👥 Citizen Experience App</div>
                                <p style={{fontSize: '12px', color: '#9ca3af', marginBottom: '15px'}}>Public-facing platform for patients and families to find care and check medicine availability</p>
                                
                                <div className="grid-2">
                                    <div>
                                        <h4 style={{fontSize: '13px', marginBottom: '10px', color: 'var(--primary-light)'}}>Features</h4>
                                        <ul className="feature-list">
                                            <li>🔍 Find nearby PHCs by facility type</li>
                                            <li>💊 Check medicine availability real-time</li>
                                            <li>📊 Health Pulse (national overview)</li>
                                            <li>🤖 HealthGrid AI Chat Assistant</li>
                                            <li>📍 Facility status & capacity info</li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h4 style={{fontSize: '13px', marginBottom: '10px', color: 'var(--primary-light)'}}>Key Metrics</h4>
                                        <div className="metric">
                                            <span className="metric-label">Medicines Availability</span>
                                            <span className="metric-value">91%</span>
                                        </div>
                                        <div className="metric">
                                            <span className="metric-label">Bed Occupancy</span>
                                            <span className="metric-value">82%</span>
                                        </div>
                                        <div className="metric">
                                            <span className="metric-label">Workforce Readiness</span>
                                            <span className="metric-value">94%</span>
                                        </div>
                                        <div className="metric">
                                            <span className="metric-label">Patient Adoption</span>
                                            <span className="metric-value">78%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        {/* AUTHORITY DASHBOARD */}
                        <div className={`phase-container ${activePhase === 'authority' ? 'active' : ''}`}>
                            <div className="section">
                                <div className="section-title">📊 Authority Dashboard</div>
                                <p style={{fontSize: '12px', color: '#9ca3af', marginBottom: '15px'}}>Real-time visibility for district and state administrators</p>
                                
                                <div className="grid-2">
                                    <div>
                                        <h4 style={{fontSize: '13px', marginBottom: '10px', color: 'var(--primary-light)'}}>Key Capabilities</h4>
                                        <ul className="feature-list">
                                            <li>📍 5-district heatmap visualization</li>
                                            <li>📈 7-day demand forecast</li>
                                            <li>🚨 Real-time alert system</li>
                                            <li>✅ Resource transfer approvals</li>
                                            <li>📊 SLA compliance tracking</li>
                                            <li>🔄 Workflow management</li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h4 style={{fontSize: '13px', marginBottom: '10px', color: 'var(--primary-light)'}}>District Performance</h4>
                                        <table className="table">
                                            <thead><tr><th>District</th><th>PHCs</th><th>Status</th></tr></thead>
                                            <tbody>
                                                <tr><td>Nashik</td><td>52</td><td>🟢 Stable</td></tr>
                                                <tr><td>Pune</td><td>48</td><td>🟡 Caution</td></tr>
                                                <tr><td>Aurangabad</td><td>35</td><td>🟢 Stable</td></tr>
                                                <tr><td>Nagpur</td><td>41</td><td>🟢 Stable</td></tr>
                                                <tr><td>Kolhapur</td><td>28</td><td>🟢 Stable</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        {/* EMERGENCY RESPONSE */}
                        <div className={`phase-container ${activePhase === 'emergency' ? 'active' : ''}`}>
                            <div className="section">
                                <div className="section-title">🆘 Emergency Response System</div>
                                <p style={{fontSize: '12px', color: '#9ca3af', marginBottom: '15px'}}>Coordinated response during crises with federated learning and real-time collaboration</p>
