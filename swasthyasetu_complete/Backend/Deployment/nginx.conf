# SwasthyaSetu Backend - Production Nginx Configuration
# Reverse proxy, SSL termination, caching, and load balancing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ========================================================================
  # LOGGING
  # ========================================================================

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  log_format json_log escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_path":"$request_uri",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,'
      '"response_time":$upstream_response_time,'
      '"user_agent":"$http_user_agent"'
    '}';

  access_log /var/log/nginx/access.log json_log;

  # ========================================================================
  # PERFORMANCE
  # ========================================================================

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 10M;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/json application/javascript;
  gzip_disable "msie6";

  # ========================================================================
  # RATE LIMITING
  # ========================================================================

  # Limit requests per IP (10 requests per second)
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

  # ========================================================================
  # UPSTREAM SERVERS
  # ========================================================================

  upstream swasthyasetu_backend {
    # Health check enabled
    server backend:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
  }

  # ========================================================================
  # HTTP REDIRECT
  # ========================================================================

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
  }

  # ========================================================================
  # HTTPS SERVER (Production)
  # ========================================================================

  server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name api.swasthyasetu.health;

    # SSL Configuration
    ssl_certificate /etc/nginx/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/certs/private.key;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    # ====================================================================
    # HEALTH CHECK
    # ====================================================================

    location /health {
      proxy_pass http://swasthyasetu_backend;
      access_log off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # ====================================================================
    # API ENDPOINTS
    # ====================================================================

    location /api/v2/auth/login {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://swasthyasetu_backend;
      
      # WebSocket support for real-time updates
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /api/v2/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass http://swasthyasetu_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/v2/scenarios {
      # Scenarios are computationally intensive
      limit_req zone=api_limit burst=5 nodelay;
      proxy_pass http://swasthyasetu_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      
      # Increase timeout for scenario computation
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    location /api/v2/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://swasthyasetu_backend;

      # Proxy headers
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;

      # Timeouts
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 15s;

      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;

      # Cache GET requests for 60 seconds
      proxy_cache_valid 200 60s;
      proxy_cache_bypass $http_pragma $http_authorization;
    }

    # ====================================================================
    # STATIC FILES (Frontend)
    # ====================================================================

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      
      # Cache static assets
      expires 1d;
      add_header Cache-Control "public, immutable";
    }

    # ====================================================================
    # METRICS & MONITORING
    # ====================================================================

    location /metrics {
      access_log off;
      proxy_pass http://swasthyasetu_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # ====================================================================
    # STATUS PAGE
    # ====================================================================

    location /nginx_status {
      stub_status on;
      access_log off;
      allow 127.0.0.1;
      allow 172.16.0.0/12; # Docker internal network
      deny all;
    }
  }

  # ========================================================================
  # DEVELOPMENT SERVER (Optional - Port 8080)
  # ========================================================================

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # No SSL for development
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v2/ {
      proxy_pass http://swasthyasetu_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }

  # ========================================================================
  # STATUS PAGES & ERROR HANDLING
  # ========================================================================

  error_page 404 /404.html;
  error_page 500 502 503 504 /50x.html;

  location = /50x.html {
    root /usr/share/nginx/html;
  }

  location = /404.html {
    root /usr/share/nginx/html;
  }
}
