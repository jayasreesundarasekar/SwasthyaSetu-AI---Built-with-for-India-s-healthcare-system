<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwasthyaSetu Dashboard Customization - Phase 4C</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafbfc;
            color: #1a202c;
        }
        
        :root {
            --primary: #0F4C75;
            --primary-dark: #0a2f52;
            --success: #3ECF8E;
            --warning: #F7B32B;
            --danger: #E63946;
            --neutral-50: #f9fafb;
            --neutral-100: #f3f4f6;
            --neutral-200: #e5e7eb;
            --neutral-400: #9ca3af;
            --neutral-600: #4b5563;
            --neutral-800: #1f2937;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid var(--neutral-200);
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--neutral-600);
            text-transform: uppercase;
            margin-bottom: 12px;
            margin-top: 20px;
        }
        
        .sidebar-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        
        .sidebar-item:hover {
            background: var(--neutral-100);
        }
        
        .sidebar-item.active {
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            border-left-color: var(--primary);
            font-weight: 600;
            color: var(--primary);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: white;
            border-bottom: 1px solid var(--neutral-200);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--primary);
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-secondary {
            background: var(--neutral-100);
            color: var(--primary);
            border: 1px solid var(--neutral-200);
        }
        
        .btn-secondary:hover {
            background: var(--neutral-200);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        .section {
            background: white;
            border: 1px solid var(--neutral-200);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-subtitle {
            font-size: 13px;
            color: var(--neutral-600);
            margin-bottom: 12px;
        }
        
        .widget-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .widget-card {
            background: var(--neutral-50);
            border: 2px solid var(--neutral-200);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .widget-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(15, 76, 117, 0.1);
        }
        
        .widget-card.selected {
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            border-color: var(--primary);
        }
        
        .widget-checkbox {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neutral-300);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .widget-card.selected .widget-checkbox {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .widget-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .widget-name {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .widget-desc {
            font-size: 12px;
            color: var(--neutral-600);
        }
        
        .role-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--neutral-200);
            padding-bottom: 12px;
        }
        
        .role-tab {
            padding: 8px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--neutral-600);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .role-tab:hover {
            color: var(--primary);
        }
        
        .role-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--neutral-800);
        }
        
        .form-select, .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--neutral-200);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }
        
        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 76, 117, 0.1);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-label {
            font-size: 13px;
            cursor: pointer;
            color: var(--neutral-800);
        }
        
        .preview-section {
            background: var(--neutral-50);
            border: 1px solid var(--neutral-200);
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
        }
        
        .preview-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--neutral-800);
        }
        
        .widget-preview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .preview-widget {
            background: white;
            border: 1px solid var(--neutral-200);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: var(--neutral-600);
        }
        
        .export-format {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }
        
        .export-option {
            padding: 12px;
            border: 1px solid var(--neutral-200);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .export-option:hover {
            border-color: var(--primary);
            background: var(--neutral-50);
        }
        
        .export-icon {
            font-size: 20px;
            margin-bottom: 6px;
        }
        
        .export-label {
            font-size: 12px;
            font-weight: 500;
        }
        
        .sla-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .sla-success { background: rgba(62, 207, 142, 0.1); color: #065f46; }
        .sla-warning { background: rgba(247, 179, 43, 0.1); color: #92400e; }
        .sla-danger { background: rgba(230, 57, 70, 0.1); color: #991b1b; }
        
        .settings-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }
        
        .settings-table th {
            background: var(--neutral-100);
            padding: 10px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid var(--neutral-200);
        }
        
        .settings-table td {
            padding: 10px;
            border-bottom: 1px solid var(--neutral-200);
        }
        
        .toggle {
            width: 40px;
            height: 24px;
            background: var(--neutral-300);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }
        
        .toggle.active {
            background: var(--success);
        }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s;
        }
        
        .toggle.active::after {
            left: 18px;
        }
        
        @media (max-width: 768px) {
            .widget-grid { grid-template-columns: 1fr; }
            .export-format { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    
    <script type="text/babel">
        const { useState } = React;
        
        function DashboardCustomization() {
            const [currentPage, setCurrentPage] = useState('widgets');
            const [selectedRole, setSelectedRole] = useState('phc_staff');
            const [selectedWidgets, setSelectedWidgets] = useState({
                phc_staff: ['bed_occupancy', 'medicine_stock', 'today_patients', 'pending_approvals'],
                district_admin: ['district_summary', 'phc_status_grid', 'demand_forecast', 'critical_alerts'],
                state_director: ['national_overview', 'state_heatmap', 'budget_utilization', 'compliance_score']
            });
            
            const [refreshSettings, setRefreshSettings] = useState({
                auto_refresh: true,
                refresh_interval: 60,
                offline_sync: true
            });
            
            const [exportSettings, setExportSettings] = useState({
                format: 'pdf',
                include_timestamp: true,
                include_charts: true,
                include_audit_trail: false,
                schedule: 'manual'
            });
            
            const availableWidgets = {
                phc_staff: [
                    { id: 'bed_occupancy', icon: '🛏️', name: 'Bed Occupancy', desc: 'Real-time bed status' },
                    { id: 'medicine_stock', icon: '💊', name: 'Medicine Stock', desc: 'Inventory levels' },
                    { id: 'today_patients', icon: '👥', name: 'Patients Today', desc: 'Daily footfall' },
                    { id: 'pending_approvals', icon: '⏳', name: 'Pending Approvals', desc: 'Action needed' },
                    { id: 'alerts', icon: '🔔', name: 'Alerts', desc: 'Critical notifications' },
                    { id: 'forecast', icon: '📈', name: 'Forecast', desc: '14-day medicine forecast' }
                ],
                district_admin: [
                    { id: 'district_summary', icon: '📊', name: 'District Summary', desc: 'All PHCs overview' },
                    { id: 'phc_status_grid', icon: '🗺️', name: 'PHC Status Grid', desc: 'District map view' },
                    { id: 'demand_forecast', icon: '📈', name: 'Demand Forecast', desc: 'Multi-PHC trends' },
                    { id: 'critical_alerts', icon: '🚨', name: 'Critical Alerts', desc: 'Urgent issues' },
                    { id: 'resource_allocation', icon: '🚚', name: 'Resource Allocation', desc: 'Supply chain' },
                    { id: 'collaboration_requests', icon: '🤝', name: 'Collaboration Requests', desc: 'Inter-district flows' }
                ],
                state_director: [
                    { id: 'national_overview', icon: '🇮🇳', name: 'National Overview', desc: '426 PHCs status' },
                    { id: 'state_heatmap', icon: '🌡️', name: 'State Heatmap', desc: 'Crisis indicators' },
                    { id: 'budget_utilization', icon: '💰', name: 'Budget Utilization', desc: 'Spending trends' },
                    { id: 'compliance_score', icon: '✅', name: 'Compliance Score', desc: 'Governance metrics' },
                    { id: 'federated_learning', icon: '🧠', name: 'Federated Learning', desc: 'Model performance' },
                    { id: 'emergency_dashboard', icon: '🆘', name: 'Emergency Dashboard', desc: 'Active incidents' }
                ]
            };
            
            const toggleWidget = (widgetId) => {
                setSelectedWidgets(prev => ({
                    ...prev,
                    [selectedRole]: prev[selectedRole].includes(widgetId)
                        ? prev[selectedRole].filter(w => w !== widgetId)
                        : [...prev[selectedRole], widgetId]
                }));
            };
            
            const isWidgetSelected = (widgetId) => selectedWidgets[selectedRole].includes(widgetId);
            
            return (
                <div className="container">
                    {/* Sidebar */}
                    <div className="sidebar">
                        <div style={{fontSize: '18px', fontWeight: '600', marginBottom: '20px', color: 'var(--primary)'}}>
                            ⚙️ Customization
                        </div>
                        
                        <div className="sidebar-title">Configuration</div>
                        <div 
                            className={`sidebar-item ${currentPage === 'widgets' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('widgets')}
                        >
                            📊 Dashboard Widgets
                        </div>
                        <div 
                            className={`sidebar-item ${currentPage === 'display' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('display')}
                        >
                            👁️ Display Settings
                        </div>
                        <div 
                            className={`sidebar-item ${currentPage === 'notifications' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('notifications')}
                        >
                            🔔 Notifications
                        </div>
                        <div 
                            className={`sidebar-item ${currentPage === 'export' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('export')}
                        >
                            📤 Export & Reports
                        </div>
                        <div 
                            className={`sidebar-item ${currentPage === 'sla' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('sla')}
                        >
                            ⏱️ SLA Configuration
                        </div>
                        
                        <div className="sidebar-title">About</div>
                        <div style={{fontSize: '12px', color: 'var(--neutral-600)', lineHeight: '1.5'}}>
                            <p>🎯 <strong>SwasthyaSetu v4.2</strong></p>
                            <p>Phase 4C: Advanced Customization</p>
                            <p style={{marginTop: '8px', fontSize: '11px'}}>Last sync: 2m ago</p>
                        </div>
                    </div>
                    
                    {/* Main Content */}
                    <div className="main-content">
                        <div className="header">
                            <div className="header-title">
                                {currentPage === 'widgets' && '📊 Dashboard Widget Configuration'}
                                {currentPage === 'display' && '👁️ Display & Refresh Settings'}
                                {currentPage === 'notifications' && '🔔 Alert & Notification Settings'}
                                {currentPage === 'export' && '📤 Export & Report Scheduling'}
                                {currentPage === 'sla' && '⏱️ SLA & Approval Chain Configuration'}
                            </div>
                            <div className="header-actions">
                                <button className="btn btn-secondary">💾 Save Draft</button>
                                <button className="btn btn-primary">✓ Apply Changes</button>
                            </div>
                        </div>
                        
                        <div className="content">
                            
                            {/* Widget Configuration */}
                            {currentPage === 'widgets' && (
                                <>
                                    <div className="section">
                                        <div className="section-title">Select Your Role</div>
                                        <div className="role-tabs">
                                            <button 
                                                className={`role-tab ${selectedRole === 'phc_staff' ? 'active' : ''}`}
                                                onClick={() => setSelectedRole('phc_staff')}
                                            >
                                                👨‍⚕️ PHC Staff
                                            </button>
                                            <button 
                                                className={`role-tab ${selectedRole === 'district_admin' ? 'active' : ''}`}
                                                onClick={() => setSelectedRole('district_admin')}
                                            >
                                                📋 District Admin
                                            </button>
                                            <button 
                                                className={`role-tab ${selectedRole === 'state_director' ? 'active' : ''}`}
                                                onClick={() => setSelectedRole('state_director')}
                                            >
                                                🎯 State Director
                                            </button>
                                        </div>
                                        <p className="section-subtitle">
                                            {selectedRole === 'phc_staff' && 'Configure your PHC-level dashboard. Focus on daily operations, patient care, and local inventory.'}
                                            {selectedRole === 'district_admin' && 'Manage district overview across 18 PHCs. Monitor coordination and cross-PHC workflows.'}
                                            {selectedRole === 'state_director' && 'State-wide intelligence for 426 PHCs across Maharashtra. Strategic oversight and budget management.'}
                                        </p>
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-title">Available Widgets ({selectedWidgets[selectedRole].length} selected)</div>
                                        <div className="widget-grid">
                                            {availableWidgets[selectedRole].map(widget => (
                                                <div 
                                                    key={widget.id}
                                                    className={`widget-card ${isWidgetSelected(widget.id) ? 'selected' : ''}`}
                                                    onClick={() => toggleWidget(widget.id)}
                                                >
                                                    <div className="widget-checkbox">
                                                        {isWidgetSelected(widget.id) && '✓'}
                                                    </div>
                                                    <div className="widget-icon">{widget.icon}</div>
                                                    <div className="widget-name">{widget.name}</div>
                                                    <div className="widget-desc">{widget.desc}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-title">Dashboard Preview</div>
                                        <div className="preview-section">
                                            <div className="preview-title">Your {selectedRole === 'phc_staff' ? 'PHC' : selectedRole === 'district_admin' ? 'District' : 'State'} Dashboard Layout:</div>
                                            <div className="widget-preview">
                                                {selectedWidgets[selectedRole].map((widgetId, idx) => {
                                                    const widget = availableWidgets[selectedRole].find(w => w.id === widgetId);
                                                    return (
                                                        <div key={idx} className="preview-widget">
                                                            <span>{widget.icon}</span> {widget.name}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                            
                            {/* Display Settings */}
                            {currentPage === 'display' && (
                                <>
                                    <div className="section">
                                        <div className="section-title">Auto-Refresh Settings</div>
                                        <div className="form-group">
                                            <div className="checkbox-group">
                                                <input 
                                                    type="checkbox" 
                                                    id="auto_refresh"
                                                    checked={refreshSettings.auto_refresh}
                                                    onChange={(e) => setRefreshSettings({...refreshSettings, auto_refresh: e.target.checked})}
                                                />
                                                <label className="checkbox-label" htmlFor="auto_refresh">
                                                    Enable auto-refresh of live data
                                                </label>
                                            </div>
                                        </div>
                                        {refreshSettings.auto_refresh && (
                                            <div className="form-group">
                                                <label className="form-label">Refresh Interval (seconds)</label>
                                                <input 
                                                    type="number" 
                                                    className="form-input"
                                                    value={refreshSettings.refresh_interval}
                                                    onChange={(e) => setRefreshSettings({...refreshSettings, refresh_interval: parseInt(e.target.value)})}
                                                    min="10"
                                                    max="300"
                                                />
                                                <div style={{fontSize: '11px', color: 'var(--neutral-600)', marginTop: '4px'}}>
                                                    Current: Every {refreshSettings.refresh_interval}s (data updated 1,440 times/day)
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-title">Data Sync & Offline Mode</div>
                                        <div className="checkbox-group">
                                            <input 
                                                type="checkbox" 
                                                id="offline_sync"
                                                checked={refreshSettings.offline_sync}
                                                onChange={(e) => setRefreshSettings({...refreshSettings, offline_sync: e.target.checked})}
                                            />
                                            <label className="checkbox-label" htmlFor="offline_sync">
                                                Enable offline sync (sync when network returns)
                                            </label>
                                        </div>
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-title">Theme & Appearance</div>
                                        <div className="form-group">
                                            <label className="form-label">Dashboard Theme</label>
                                            <select className="form-select">
                                                <option>Light (Default)</option>
                                                <option>Dark</option>
                                                <option>High Contrast</option>
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Chart Type</label>
                                            <select className="form-select">
                                                <option>Line Charts</option>
                                                <option>Bar Charts</option>
                                                <option>Area Charts</option>
                                            </select>
                                        </div>
                                    </div>
                                </>
                            )}
                            
                            {/* Notifications */}
                            {currentPage === 'notifications' && (
                                <>
                                    <div className="section">
                                        <div className="section-title">Alert Thresholds</div>
                                        <div className="form-group">
                                            <label className="form-label">Medicine Stock Critical Threshold (%)</label>
                                            <input type="number" className="form-input" placeholder="20" />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Bed Occupancy Alert Level (%)</label>
                                            <input type="number" className="form-input" placeholder="85" />
                                        </div>
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-title">Notification Channels</div>
                                        <table className="settings-table">
                                            <thead>
                                                <tr>
                                                    <th>Channel</th>
                                                    <th>Critical</th>
                                                    <th>Warning</th>
                                                    <th>Info</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td>📱 Push Notification</td>
                                                    <td><button className="toggle active"></button></td>
                                                    <td><button className="toggle active"></button></td>
                                                    <td><button className="toggle"></button></td>
                                                </tr>
                                                <tr>
                                                    <td>📧 Email</td>
                                                    <td><button className="toggle active"></button></td>
                                                    <td><button className="toggle"></button></td>
                                                    <td><button className="toggle"></button></td>
                                                </tr>
                                                <tr>
                                                    <td>💬 SMS</td>
                                                    <td><button className="toggle active"></button></td>
                                                    <td><button className="toggle"></button></td>
                                                    <td><button className="toggle"></button></td>
                                                </tr>
                                                <tr>
                                                    <td>📞 Phone Call</td>
                                                    <td><button className="toggle active"></button></td>
                                                    <td><button className="toggle"></button></td>
                                                    <td><button className="toggle"></button></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </>
                            )}
                            
                            {/* Export Settings */}
                            {currentPage === 'export' && (
                                <>
                                    <div className="section">
                                        <div className="section-title">Export Format & Schedule</div>
                                        <div className="form-group">
                                            <label className="form-label">Default Export Format</label>
                                            <div className="export-format">
                                                {['📄 PDF', '📊 Excel', '📋 CSV'].map((fmt, idx) => (
                                                    <div key={idx} className="export-option" onClick={() => setExportSettings({...exportSettings, format: fmt.split(' ')[1].toLowerCase()})}>
                                                        <div className="export-icon">{fmt.split(' ')[0]}</div>
                                                        <div className="export-label">{fmt.split(' ')[1]}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-title">Report Contents</div>
                                        <div className="checkbox-group">
                                            <input type="checkbox" id="include_charts" defaultChecked />
                                            <label className="checkbox-label" htmlFor="include_charts">Include Charts & Visualizations</label>
                                        </div>
                                        <div className="checkbox-group">
                                            <input type="checkbox" id="include_timestamp" defaultChecked />
                                            <label className="checkbox-label" htmlFor="include_timestamp">Include Generated Timestamp</label>
                                        </div>
                                        <div className="checkbox-group">
                                            <input type="checkbox" id="include_audit" />
                                            <label className="checkbox-label" htmlFor="include_audit">Include Full Audit Trail</label>
                                        </div>
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-title">Automated Report Scheduling</div>
                                        <div className="form-group">
                                            <label className="form-label">Report Frequency</label>
                                            <select className="form-select">
                                                <option>Manual Only</option>
                                                <option>Daily (9:00 AM)</option>
                                                <option>Weekly (Monday)</option>
                                                <option>Monthly (1st)</option>
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Email Recipients</label>
                                            <input type="email" className="form-input" placeholder="admin@health.gov.in" />
                                        </div>
                                    </div>
                                </>
                            )}
                            
                            {/* SLA Configuration */}
                            {currentPage === 'sla' && (
                                <>
                                    <div className="section">
                                        <div className="section-title">Approval Chain SLAs</div>
                                        <table className="settings-table">
                                            <thead>
                                                <tr>
                                                    <th>Approval Step</th>
                                                    <th>Target Time</th>
                                                    <th>Current Status</th>
                                                    <th>Edit</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td>PHC Staff Initiation</td>
                                                    <td>0h (immediate)</td>
                                                    <td><span className="sla-badge sla-success">100%</span></td>
                                                    <td><button className="btn btn-secondary" style={{padding: '4px 8px', fontSize: '11px'}}>✏️</button></td>
                                                </tr>
                                                <tr>
                                                    <td>District Admin Review</td>
                                                    <td>2h</td>
                                                    <td><span className="sla-badge sla-success">94%</span></td>
                                                    <td><button className="btn btn-secondary" style={{padding: '4px 8px', fontSize: '11px'}}>✏️</button></td>
                                                </tr>
                                                <tr>
                                                    <td>State Director Approval</td>
                                                    <td>6h</td>
                                                    <td><span className="sla-badge sla-warning">87%</span></td>
                                                    <td><button className="btn btn-secondary" style={{padding: '4px 8px', fontSize: '11px'}}>✏️</button></td>
                                                </tr>
                                                <tr>
                                                    <td>Resource Execution</td>
                                                    <td>24h</td>
                                                    <td><span className="sla-badge sla-success">92%</span></td>
                                                    <td><button className="btn btn-secondary" style={{padding: '4px 8px', fontSize: '11px'}}>✏️</button></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    
                                    <div className="section">
                                        <div className="section-title">Emergency Protocol SLAs</div>
                                        <div className="form-group">
                                            <label className="form-label">Critical Alert Response SLA (minutes)</label>
                                            <input type="number" className="form-input" value="30" />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Emergency Escalation Trigger (hours)</label>
                                            <input type="number" className="form-input" value="4" />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Breach Notification Recipients</label>
                                            <input type="email" className="form-input" placeholder="director@maharashtra.gov.in" />
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<DashboardCustomization />);
    </script>
</body>
</html>
